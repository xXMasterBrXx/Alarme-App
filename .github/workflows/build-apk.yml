name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore and Environment
        run: |
          # Use consistent debug.keystore from base64 if available, or decode the project master key
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
              echo "Decoding DEBUG_KEYSTORE_BASE64 secret..."
              echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            else
              echo "Decoding embedded project debug keystore..."
              echo "" | base64 -d > debug.keystore
            fi
          fi
          
          # Create empty .env if not present
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          gradle :app:assembleDebug -PversionName="${{ github.ref_name }}" --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build/outputs/release-apk
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/release-apk/chronoclock-alarm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronoclock-alarm-apk
          path: build/outputs/release-apk/chronoclock-alarm.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release-apk/chronoclock-alarm.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
