name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK (Release/Debug)
        run: |
          chmod +x ./gradlew || true
          gradle assembleDebug --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p build/outputs/release-apk
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/release-apk/chronoclock-alarm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronoclock-alarm-apk
          path: build/outputs/release-apk/chronoclock-alarm.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release-apk/chronoclock-alarm.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
